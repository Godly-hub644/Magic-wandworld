<!DOCTYPE html>
<html>
<head>
  <title>MAGIC WAND WORLD V3 - MTN FIX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #info { position: absolute; bottom: 100px; width: 100%; text-align: center; color: white; background: rgba(0,0,0,0.5); padding: 10px; z-index: 10; }
    #joystick { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; z-index: 20; }
    #stick { position: absolute; width: 50px; height: 50px; background: white; border-radius: 50%; top: 35px; left: 35px; }
  </style>
  <!-- THIS CDN WORKS ON MTN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
</head>
<body>
  <div id="info">Drag joystick to walk</div>
  <div id="joystick"><div id="stick"></div></div>
  <script>
    const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB);
    const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
    const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
    
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x228B22})); 
    ground.rotation.x=-Math.PI/2; scene.add(ground);
    
    // PIRATE CHARACTER
    const group=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1),new THREE.MeshStandardMaterial({color:0x003366}));
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.4),new THREE.MeshStandardMaterial({color:0xffdbac})); head.position.y=0.9;
    const hat=new THREE.Mesh(new THREE.ConeGeometry(0.5,0.4),new THREE.MeshStandardMaterial({color:0x8B4513})); hat.position.y=1.1;
    group.add(body,head,hat); group.position.set(0,1,0); scene.add(group);
    
    scene.add(new THREE.AmbientLight(0xffffff,1.2));
    camera.position.set(0,8,12); camera.lookAt(0,0,0);

    // 4 KINGDOM ZONES
    const kingdoms=[
      {name:"Sunset", pos:[-40,0,-40], color:0xff8800},
      {name:"Ice", pos:[40,0,-40], color:0x88ddff},
      {name:"Forest", pos:[-40,0,40], color:0x006400},
      {name:"Dragon", pos:[40,0,40], color:0xaa0000}
    ];
    kingdoms.forEach(k=>{
      const zone=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:k.color,transparent:true,opacity:0.5}));
      zone.rotation.x=-Math.PI/2; zone.position.set(k.pos[0],0.1,k.pos[2]); scene.add(zone);
    });

    // JOYSTICK
    let moveX=0, moveZ=0; const joy=document.getElementById('joystick'); const stick=document.getElementById('stick');
    joy.addEventListener('touchmove',e=>{
      const t=e.touches[0]; const rect=joy.getBoundingClientRect();
      let x=t.clientX-rect.left-60; let y=t.clientY-rect.top-60;
      const dist=Math.min(35,Math.sqrt(x*x+y*y)); const angle=Math.atan2(y,x);
      stick.style.left=60+Math.cos(angle)*dist-25+'px'; stick.style.top=60+Math.sin(angle)*dist-25+'px';
      moveX=Math.cos(angle)*0.3; moveZ=Math.sin(angle)*0.3;
    });
    joy.addEventListener('touchend',()=>{stick.style.left='35px'; stick.style.top='35px'; moveX=0; moveZ=0;});

    function animate(){
      requestAnimationFrame(animate);
      group.position.x+=moveX; group.position.z+=moveZ;
      camera.position.x=group.position.x; camera.position.z=group.position.z+12; camera.lookAt(group.position);
      renderer.render(scene,camera);
    }
    animate();
  </script>
</body>
</html>
